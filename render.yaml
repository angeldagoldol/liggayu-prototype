# Deploy from a repository whose root contains this file and Dockerfile.
services:
  - type: web
    name: scoredesk
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: BIND_ADDRESS
        value: "0.0.0.0"
